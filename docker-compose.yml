name: rockcliff-apartment-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rockcliff}
      POSTGRES_USER: ${POSTGRES_USER:-rockcliff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apartment-app/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [apartment]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rockcliff}
      POSTGRES_USER: ${POSTGRES_USER:-rockcliff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apartment-app/.env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      AUTO_CREATE_SCHEMA: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [apartment]

  web:
    build:
      context: .
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks: [apartment]

volumes:
  postgres_data:
    name: rockcliff-apartment-postgres-data

networks:
  apartment:
    name: rockcliff-apartment-network
